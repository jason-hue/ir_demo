# \u4FE1\u606F\u68C0\u7D22\u793A\u4F8B\u7A0B\u5E8F\u5DE5\u4F5C\u7684\u6839\u76EE\u5F55
irdemo.dir.home = workspace
# \u4FE1\u606F\u68C0\u7D22\u793A\u4F8B\u7A0B\u5E8F\u7D22\u5F15\u5B58\u653E\u76EE\u5F55
irdemo.dir.idx = ${irdemo.dir.home}/idx
# \u4FE1\u606F\u68C0\u7D22\u793A\u4F8B\u7A0B\u5E8F\u722C\u866B\u6570\u636E\u5B58\u653E\u76EE\u5F55
irdemo.dir.crawler = ${irdemo.dir.home}/crawler
# 生产启动爬虫开关：保持关闭，只有显式传入 --irdemo.dir.startCrawler=true 才会在 ready 后启动腾讯抓取
irdemo.dir.startCrawler = false

# Optional AI runtime configuration (disabled keeps lexical-only mode)
app.ai.enabled = false
app.ai.provider = ollama
app.ai.ollama.base-url = http://127.0.0.1:11434
app.ai.ollama.chat-model = llama3.2:1b
app.ai.ollama.embedding-model = nomic-embed-text

# Optional vector runtime configuration (disabled keeps lexical-only mode)
app.vector.enabled = false
app.vector.host = 127.0.0.1
app.vector.port = 6334
app.vector.tls = false
app.vector.collection = articles
app.vector.api-key =

# Tencent crawler category configuration (production default path)
app.crawler.tencent.enabled = true
app.crawler.tencent.categories[0].name = finance
app.crawler.tencent.categories[0].enabled = true
app.crawler.tencent.categories[0].list-urls[0] = https://news.qq.com/ch/finance/
app.crawler.tencent.categories[0].per-run-limit = 1
app.crawler.tencent.categories[0].source-label = tencent-news-finance
app.crawler.tencent.categories[1].name = tech
app.crawler.tencent.categories[1].enabled = true
app.crawler.tencent.categories[1].list-urls[0] = https://news.qq.com/ch/tech/
app.crawler.tencent.categories[1].per-run-limit = 1
app.crawler.tencent.categories[1].source-label = tencent-news-tech
app.crawler.tencent.categories[2].name = edu
app.crawler.tencent.categories[2].enabled = true
app.crawler.tencent.categories[2].list-urls[0] = https://news.qq.com/ch/edu/
app.crawler.tencent.categories[2].per-run-limit = 1
app.crawler.tencent.categories[2].source-label = tencent-news-edu

# Optional Lucene startup seeding for isolated smoke runs
app.seed.lucene.enabled = false
app.seed.lucene.resource = classpath:fixtures/tencent/news/runtime-seed-articles.json

# AI provider defaults
irdemo.ai.ollama.enabled = true
irdemo.ai.ollama.base-url = http://127.0.0.1:11434
irdemo.ai.ollama.chat-model = llama3.2:1b
irdemo.ai.ollama.embedding-model = nomic-embed-text
irdemo.ai.ollama.chat-timeout = 120s
irdemo.ai.retrieval.vector-timeout = 120s
irdemo.ai.ollama.warmup-enabled = true
irdemo.ai.ollama.warmup-timeout = 45s
irdemo.ai.ollama.keep-warm-interval = 4m
irdemo.ai.ollama.keep-alive = 10m
irdemo.ai.ollama.warmup-prompt = 请只回复：ready
irdemo.ai.ollama.chat-context-top-k = 4
irdemo.ai.ollama.chat-chunk-char-limit = 320
irdemo.ai.ollama.chat-num-predict = 96
irdemo.ai.ollama.chat-num-ctx = 2048
irdemo.ai.ollama.chat-temperature = 0.1
irdemo.ai.ollama.chat-top-p = 0.8

# Vector provider defaults
irdemo.ai.qdrant.enabled = true
irdemo.ai.qdrant.host = 127.0.0.1
irdemo.ai.qdrant.http-port = 6333
irdemo.ai.qdrant.grpc-port = 6334
irdemo.ai.qdrant.collection-name = news_article_chunks
irdemo.ai.qdrant.use-tls = false
irdemo.ai.qdrant.initialize-schema = false

# Availability probes stay lightweight and must not block lexical startup
irdemo.ai.provider-status.connect-timeout = 500ms
irdemo.ai.provider-status.read-timeout = 1500ms

# Spring AI starter wiring inherits the local-first defaults above
spring.ai.ollama.base-url = ${irdemo.ai.ollama.base-url}
spring.ai.ollama.init.pull-model-strategy = never
spring.ai.ollama.chat.options.model = ${irdemo.ai.ollama.chat-model}
spring.ai.ollama.embedding.options.model = ${irdemo.ai.ollama.embedding-model}
spring.ai.vectorstore.type = none
spring.ai.vectorstore.qdrant.host = ${irdemo.ai.qdrant.host}
spring.ai.vectorstore.qdrant.port = ${irdemo.ai.qdrant.grpc-port}
spring.ai.vectorstore.qdrant.collection-name = ${irdemo.ai.qdrant.collection-name}
spring.ai.vectorstore.qdrant.use-tls = ${irdemo.ai.qdrant.use-tls}
spring.ai.vectorstore.qdrant.initialize-schema = ${irdemo.ai.qdrant.initialize-schema}
